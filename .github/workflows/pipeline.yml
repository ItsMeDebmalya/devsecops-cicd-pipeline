---
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: devsecops-demo

jobs:
  # ------------------------------------------------------------------ DEV --
  lint-test:
    name: "Dev · lint + unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt ruff pytest
      - name: Lint (ruff)
        run: ruff check app
      - name: Unit tests (pytest)
        run: python -m pytest -q

  sast:
    name: "SAST · SonarQube quality gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Raise vm.max_map_count for SonarQube Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start SonarQube server
        run: docker run -d --name sonarqube -p 9000:9000 sonarqube:9.9-community
      - name: Wait for SonarQube to be UP
        run: |
          status=starting
          for i in $(seq 1 60); do
            status=$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null || echo starting)
            echo "attempt $i: $status"
            [ "$status" = "UP" ] && break
            sleep 5
          done
          if [ "$status" != "UP" ]; then
            echo "SonarQube failed to start"; docker logs sonarqube | tail -60; exit 1
          fi
      - name: Generate analysis token
        run: |
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            --data-urlencode "login=admin" \
            --data-urlencode "previousPassword=admin" \
            --data-urlencode "password=Sonar!2345" >/dev/null
          TOKEN=$(curl -s -u admin:'Sonar!2345' -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            --data-urlencode "name=ci-${GITHUB_RUN_ID}" | jq -r .token)
          echo "::add-mask::${TOKEN}"
          echo "SONAR_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - name: Run SonarQube analysis
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL="http://localhost:9000" \
            -e SONAR_TOKEN="${SONAR_TOKEN}" \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli:5.0
      - name: Enforce quality gate
        run: |
          task_id=$(grep ceTaskId .scannerwork/report-task.txt | cut -d= -f2-)
          echo "CE task: ${task_id}"
          for i in $(seq 1 30); do
            tstatus=$(curl -s -u "${SONAR_TOKEN}:" "http://localhost:9000/api/ce/task?id=${task_id}" | jq -r .task.status)
            echo "attempt $i: ${tstatus}"
            [ "${tstatus}" = "SUCCESS" ] && break
            [ "${tstatus}" = "FAILED" ] && { echo "analysis failed"; exit 1; }
            sleep 3
          done
          gate=$(curl -s -u "${SONAR_TOKEN}:" \
            "http://localhost:9000/api/qualitygates/project_status?projectKey=devsecops-cicd-pipeline" \
            | jq -r .projectStatus.status)
          echo "Quality gate: ${gate}"
          if [ "${gate}" != "OK" ] && [ "${gate}" != "NONE" ]; then
            echo "Quality gate failed - blocking promotion"; exit 1
          fi

  build-and-scan:
    name: "Build + container & dependency scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "${IMAGE}:${GITHUB_SHA}" .
      - name: Trivy - dependency / filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy - container image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  iac-scan:
    name: "IaC scan (tfsec + Checkov)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec (blocking on HIGH/CRITICAL)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: iac
          additional_args: --minimum-severity HIGH
      - name: Checkov (report-only)
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: iac
          quiet: true
          soft_fail: true

  # ------------------------------------------------------------------ QA ---
  promote-qa:
    name: "QA · promote (all gates passed)"
    runs-on: ubuntu-latest
    needs: [lint-test, sast, build-and-scan, iac-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Promote to QA
        run: echo "All security gates passed - promoting ${IMAGE}:${GITHUB_SHA} from Dev to QA."

  # ---------------------------------------------------------------- PROD ---
  promote-prod:
    name: "Prod · promote (after QA)"
    runs-on: ubuntu-latest
    needs: [promote-qa]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Promote to Prod
        run: echo "QA validated - promoting ${IMAGE}:${GITHUB_SHA} to Prod."
